name: Domain Security Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: domain-security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-security-safety:
    name: DNS・TLS証明書監視の安全性検証
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 監視設定を静的検証
        run: bash scripts/check-domain-security-files.sh

      - name: DNS・TLS監視の正常・警告・異常系を検証
        run: node scripts/test-domain-security-check.mjs
