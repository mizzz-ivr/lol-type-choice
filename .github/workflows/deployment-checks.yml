name: Deployment Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-safety:
    name: 本番デプロイ安全性検証
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: シェルスクリプト構文を検証
        run: bash scripts/check-production-deployment-files.sh syntax

      - name: 本番Workflowの安全条件を検証
        run: bash scripts/check-production-deployment-files.sh workflow

      - name: 本番リリース生成元証明の設定を検証
        run: bash scripts/check-release-attestation-files.sh

      - name: 本番リリース生成元証明の正常・異常系を検証
        run: node scripts/test-release-attestation-policy.mjs

      - name: リモートデプロイスクリプトを検証
        run: bash scripts/check-production-deployment-files.sh deploy-script

      - name: PM2本番設定を検証
        run: bash scripts/check-production-deployment-files.sh pm2

      - name: リリース切替と自動切り戻しを検証
        run: bash scripts/test-production-release.sh
