name: 本番デプロイ設定検証

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: デプロイ設定 / 切り戻しテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 本番手動デプロイ設定を検証
        run: bash scripts/check-production-deployment-files.sh

      - name: リリース切替と自動切り戻しを検証
        run: bash scripts/test-production-release.sh
