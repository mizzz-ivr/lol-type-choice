name: Monitoring Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: monitoring-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-safety:
    name: 本番外形監視の安全性検証
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 監視設定を静的検証
        run: bash scripts/check-production-monitoring-files.sh

      - name: 外形監視の正常・異常系を検証
        run: node scripts/test-production-health-check.mjs
