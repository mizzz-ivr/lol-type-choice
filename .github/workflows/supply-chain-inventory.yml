name: Supply Chain Inventory

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supply-chain-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: SBOM・依存ライセンス棚卸し
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: SBOM設定の静的安全性を検証
        run: bash scripts/check-supply-chain-files.sh

      - name: npm生成SBOMの完全一致重複正規化を検証
        run: node scripts/test-normalize-npm-cyclonedx.mjs

      - name: SBOMレポートの正常・警告・異常系を検証
        run: node scripts/test-supply-chain-report.mjs

      - name: install scriptなしで依存関係をインストール
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: CycloneDX SBOMとライセンスレポートを生成
        run: npm run supply-chain

      - name: 棚卸し結果をサマリーへ追加
        run: cat supply-chain/dependency-license-report.md >>"${GITHUB_STEP_SUMMARY}"

      - name: SBOM・ライセンス棚卸しを保存
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-inventory-${{ github.sha }}
          path: supply-chain/
          if-no-files-found: error
          retention-days: 14
