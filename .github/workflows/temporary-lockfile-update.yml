name: Temporary Lockfile Update

on:
  push:
    branches:
      - chore/dependency-security

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-update
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: package-lock.jsonを再生成
    if: github.repository == 'mizzz-ivr/lol-type-choice' && github.actor == 'mizzz-ivr'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 対象ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-security
          fetch-depth: 0

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install scriptなしでlockfileを再生成
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: package-lock.json以外の変更を拒否
        shell: bash
        run: |
          set -Eeuo pipefail

          unexpected="$(git status --porcelain | awk '$2 != "package-lock.json" { print }')"
          if [[ -n "${unexpected}" ]]; then
            echo "package-lock.json以外の変更を検知しました。" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: lockfile変更をコミット
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.jsonに変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "依存関係更新に合わせてlockfileを再生成"
          git push origin HEAD:chore/dependency-security
