name: Dependency Security Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: 依存関係セキュリティの安全性検証
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dependabot・Workflow・禁止操作を静的検証
        run: bash scripts/check-dependency-security-files.sh

      - name: npm auditレポートの正常・警告・重大系を検証
        run: node scripts/test-dependency-audit-report.mjs

      - name: 期限付き監査例外の完全一致・期限切れを検証
        run: node scripts/test-dependency-audit-exceptions.mjs
