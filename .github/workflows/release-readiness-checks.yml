name: Release Readiness Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-readiness-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-safety:
    name: リリース可否判定の安全性検証
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Workflowの安全条件を検証
        run: bash scripts/check-release-readiness-files.sh

      - name: GO・NO-GO判定を検証
        run: node scripts/test-release-readiness.mjs
